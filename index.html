<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Boxes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    
    <div class="box" id="box1">
      <div class="box-header">Top Box</div>
      <div class="box-content">
        <div class="options">
          <p>Colors:</p>
          <button class="color red"></button>
          <button class="color blue"></button>
          <button class="color green"></button>
        </div>
        <div class="options">
          <p>Sizes:</p>
          <button class="size">S</button>
          <button class="size">M</button>
          <button class="size">L</button>
        </div>
      </div>
    </div>

    <div class="box" id="box2">
      <div class="box-header">Middle Box</div>
      <div class="box-content">
        <div class="options">
          <p>Colors:</p>
          <button class="color red"></button>
          <button class="color blue"></button>
          <button class="color green"></button>
        </div>
        <div class="options">
          <p>Sizes:</p>
          <button class="size">S</button>
          <button class="size">M</button>
          <button class="size">L</button>
        </div>
      </div>
    </div>

    <div class="box" id="box3">
      <div class="box-header">Bottom Box</div>
      <div class="box-content">
        <div class="options">
          <p>Colors:</p>
          <button class="color red"></button>
          <button class="color blue"></button>
          <button class="color green"></button>
        </div>
        <div class="options">
          <p>Sizes:</p>
          <button class="size">S</button>
          <button class="size">M</button>
          <button class="size">L</button>
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
